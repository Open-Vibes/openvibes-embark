    <!-- Set the theme class before first paint to avoid a flash. Dark-first:
         default to dark unless the visitor stored 'light' or their OS prefers
         light with no stored choice. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("aipe-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var dark = stored ? stored === "dark" : !prefersLight;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
